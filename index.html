    }

    if(params.length){robots='noindex, follow';note='Параметры '+params.join(', ')+': не создают отдельных страниц в индексе, canonical ведёт на '+base}
    else if(!sizePage&&isS&&(F.w||F.p||F.d)){robots='noindex, follow';note='Неполный размер: страница не нужна поиску, канонический адрес — '+base}
    else note='Размерная страница: индексируется, есть текст и разметка товаров'
    setLD({'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'Главная','item':'/'},{'@type':'ListItem','position':2,'name':isS?'Шины':'Диски','item':isS?'/shiny/':'/diski/'}]});
  }
  if(r.name==='home'||r.name==='plan') setLD({'@context':'https://schema.org','@type':'WebSite','name':'ШинаБаза','description':d});
  return {t:t,d:d,canon:canon,robots:robots,h1:h1,note:note};
}
function renderSeo(r){
  var i=seoInfo(r);
  document.title=i.t.length>3?i.t:document.title;
  var el=$('#seo');
  el.innerHTML='<span class="h">Что видит поисковик (демо)</span>'+
    '<div><b>title</b><span>'+esc(i.t)+'</span></div><div><b>description</b><span>'+esc(i.d)+'</span></div><div><b>H1</b><span>'+esc(i.h1)+'</span></div>'+
    '<div><b>canonical</b><span>'+esc(i.canon)+'</span></div><div><b>robots</b><span>'+esc(i.robots)+'</span></div>'+(i.note?'<div><b>правило</b><span>'+esc(i.note)+'</span></div>':'')+
    '<div><b>разметка</b><span>JSON-LD: '+(r.name==='item'?'Product + Offer (наличие, состояние)':r.name==='catalog'?'BreadcrumbList':'WebSite')+'</span></div>';
}

/* ---------- роутер ---------- */
var route={name:'home'};
function parse(){
  var h=location.hash.replace(/^#/,'');
  var m;
  if(!h||h==='/')return {name:'home'};
  if(h==='/shiny'){F.kind='shiny';return {name:'catalog'}}
  if(h==='/diski'){F.kind='diski';return {name:'catalog'}}
  if(h==='/plan')return {name:'plan'};
  if((m=h.match(/^\/tovar\/(\d+)$/)))return {name:'item',id:+m[1]};
  if(h.charAt(0)==='/')return {name:'404'};
  return {name:'home'};
}
function render(){
  route=parse();
  var v=$('#view'),html;
  if(route.name==='home')html=viewHome();
  else if(route.name==='catalog')html=viewCatalog();
  else if(route.name==='item')html=viewItem(route.id);
  else if(route.name==='plan')html=viewPlan();
  else html=view404();
  v.innerHTML=html;
  $$('.nav a').forEach(function(a){a.classList.toggle('on',(route.name==='catalog'&&a.dataset.nav===F.kind)||(route.name==='plan'&&a.dataset.nav==='plan'))});
  renderSeo(route);
  if(route.name!=='home')window.scrollTo(0,0);
}
function renderGridOnly(){
  var list=filtered();
  $('#cnt').textContent='Найдено: '+list.length;
  $('#grid').innerHTML=list.length?list.map(cardHtml).join(''):'<div class="empty">Ничего не нашли. Сбросьте фильтры или оставьте заявку на подбор.</div>';
  renderSeo(route);
  var h1=$('h1'); if(h1&&route.name==='catalog')h1.textContent='Б/у '+(F.kind==='shiny'?'шины':'диски')+(F.kind==='shiny'&&F.w&&F.p&&F.d?' '+F.w+'/'+F.p+' R'+F.d:'');
}
var tt;function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on')},2200)}

/* ---------- события ---------- */
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='finder'){
    e.preventDefault();
    var d=new FormData(f);F.kind='shiny';F.w=d.get('w')||'';F.p=d.get('p')||'';F.d=d.get('d')||'';F.season=d.get('season')||'';
    if(location.hash==='#/shiny')render();else location.hash='#/shiny';
  }
  if(f.id==='orderForm'){
    e.preventDefault();
    var d2=new FormData(f),n=(d2.get('name')||'').trim(),ph=String(d2.get('phone')||'').replace(/\D/g,'');
    var er=$('#oerr');
    if(n.length<2){er.textContent='Укажите имя.';return}
    if(ph.length<10){er.textContent='Укажите телефон: минимум 10 цифр.';return}
    if(!d2.get('ok')){er.textContent='Нужно согласие на обработку данных.';return}
    var p=byId(route.id);sentOrders++;
    var no=1000+sentOrders+Math.floor(Math.random()*80);
    $('#orderBox').innerHTML='<div class="ok"><b>Заявка №'+no+' принята (демо)</b><br>Так выглядит уведомление менеджеру:</div><div class="tg">'+esc('🛞 Заявка №'+no+'\n'+title(p)+' · '+qtyName(p.qty)+'\nЦена: '+rub(p.price)+'\nКлиент: '+n+', '+d2.get('phone')+'\nЦель Метрики: order_item')+'</div>';
  }
});
document.addEventListener('click',function(e){
  var t=e.target;
  var k=t.closest('[data-kind]');
  if(k){F.kind=k.dataset.kind;location.hash='#/'+F.kind;if(route.name==='catalog')render();return}
  var th=t.closest('#thumbs button');
  if(th){var p=byId(route.id);$('#gmain').innerHTML=art(p,+th.dataset.v)+'<span class="badge '+p.state+'">'+stateName(p.state)+'</span>';$$('#thumbs button').forEach(function(b){b.setAttribute('aria-pressed',String(b===th))});return}
  if(t.id==='reset'){F={kind:F.kind,w:'',p:'',d:'',season:'',brand:'',minTread:3,maxPrice:80000,onlyIn:true,sort:'new',wd:'',pcd:'',type:'',q:''};render();return}
  if(t.id==='seoBtn'){seoOn=!seoOn;t.setAttribute('aria-pressed',String(seoOn));t.textContent='SEO-слой: '+(seoOn?'вкл':'выкл');$('#seo').classList.toggle('on',seoOn);return}
});
function onFilter(e){
  var t=e.target,k=t.dataset&&t.dataset.f; if(!k)return;
  var v=t.type==='checkbox'?t.checked:t.value;
  if(k==='minTread'){F.minTread=+v;$('#trv').textContent=v}
  else if(k==='maxPrice'){F.maxPrice=+v;$('#prv').textContent=rub(+v)}
  else F[k]=v;
  renderGridOnly();
}
document.addEventListener('change',onFilter);
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&(t.dataset.f==='q'||t.type==='range'))onFilter(e)});
window.addEventListener('hashchange',render);

render();
})();
</script>
</body>
</html>
